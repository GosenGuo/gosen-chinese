name: Auto content update
run-name: Refill ${{ inputs.module }} ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module whose unread stock is below five
        required: true
        type: choice
        options: [modern, classical, essay]
      target_count:
        description: Number of new validated items, maximum 30
        required: true
        default: '30'
        type: string
      request_id:
        description: Optional durable queue request identifier
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: on-demand-content-refill-${{ inputs.module }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GENERATION_RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      REFILL_MODULE: ${{ inputs.module }}
      TARGET_COUNT: ${{ inputs.target_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate existing library and offline refill safeguards
        run: |
          node scripts/validate-content-feed.mjs
          node --test scripts/test-content-feed.mjs scripts/test-refill-content.mjs
      - name: Reserve the bounded refill budget
        id: reservation
        run: node scripts/refill-content.mjs reserve
      - name: Commit reservation before any paid request
        if: steps.reservation.outputs.eligible == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/refill-ledger.json
          git commit -m 'content: reserve one bounded low-stock refill'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Generate and checkpoint up to thirty items
        if: steps.reservation.outputs.eligible == 'true'
        env:
          PACKY_API_KEY: ${{ secrets.PACKY_API_KEY }}
          PACKY_API_BASE_URL: https://www.packyapi.ai
          PACKY_API_MODEL: gpt-6.1-sol
          PACKY_API_PROTOCOL: responses
        run: node scripts/refill-content.mjs generate
      - name: Commit validated library checkpoints and usage ledger
        if: always() && steps.reservation.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          node scripts/validate-content-feed.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/library.json docs/refill-ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'content: save validated low-stock refill results'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
