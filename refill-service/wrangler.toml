name = "gosen-chinese-refill"
main = "src/index.js"
compatibility_date = "2026-11-05"
workers_dev = true

[vars]
GITHUB_OWNER = "GosenGuo"
GITHUB_REPO = "gosen-chinese"
GITHUB_WORKFLOW = "auto-content.yml"
GITHUB_REF = "main"

[[durable_objects.bindings]]
name = "REFILL_QUEUE"
class_name = "RefillQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RefillQueue"]
